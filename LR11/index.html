<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Info Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone">
    
    <div class="title-container">
        <h1 class="title title-up">more info?</h1>
    </div>
      
    
    <div class="form-card" id="formScreen">
        <h1 class="title title-down">more info?</h1>
    
      
        <form id="infoForm" onsubmit="handleSubmit(event)">
          
            <div class="question">Hello! Whats your name?</div>
            <input type="text" placeholder="Type here your name" required>

                <div class="question">Where do you work?</div>
                <input type="text" placeholder="Type here your company name" required>

                <div class="question">What information do you need?</div>
                <input type="text" placeholder="Give us more details" required>

                <div class="question">In which industry do you work?</div>
                <div class="tags">
                    <input type="radio" id="business" name="industry" value="business" required>
                    <label for="business">Business</label>

                    <input type="radio" id="startups" name="industry" value="startups">
                    <label for="startups">Start Ups</label>

                    <input type="radio" id="tech" name="industry" value="tech">
                    <label for="tech">Tech</label>

                    <input type="radio" id="sports" name="industry" value="sports">
                    <label for="sports">Sports</label>

                    <input type="radio" id="health" name="industry" value="health">
                    <label for="health">Health</label>
                </div>

                <div class="question">Leave your email</div>
                <input type="email" placeholder="Leave your email here" required>

                <div class="bottom">
                    <button type="submit" class="send-btn">Send</button>
                </div>
                
            </form>
        </div>

        <div class="form-card submitted" id="successScreen" style="display: none;">
           <h1 class="title title-down">more info?</h1>
            <h3>Thank you for contacting us!</h3>
            <p>Your message has been received.<br>We will get back to you as soon as possible.</p>
            
            <div class="bottom">
                <button type="button" class="send-btn standard-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault(); 
            document.getElementById('formScreen').style.display = 'none';
            document.getElementById('successScreen').style.display = 'flex';
        }
    </script>

</body>
</html>
